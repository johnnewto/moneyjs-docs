      more: |
        Because GROWTH has no closed-form steady state, the simulation cannot start from
        zero the way SIM does — it has to be _seeded_ near its balanced-growth path or the
        iterative solver will not converge. These figures are the chapter 11 starting
        stocks and prices: real capital `k` and `K`, inventories `in` and `IN`, the asset
        stocks, the price level `P`, the interest rates and the key ratios. The first
        dozen or so periods of the baseline are a brief transient as the model settles
        from these seeds onto the true steady-growth path; everything afterwards is the
        path itself.
  - run:
      id: baseline-run
      title: Baseline run
      description: Baseline GROWTH simulation with the relative hidden-equation condition B_bs = B_bd.
      mode: baseline
      periods: 350
      resultKey: gl8_growth_baseline
      sourceModelId: equations
      more: |
        The baseline integrates GROWTH forward for **350 periods** from the seeded
        initial stocks, with every parameter held at its calibrated value. After a brief
        transient the economy locks onto Godley & Lavoie's **steady-growth path**: real
        output `y`, consumption `c`, investment `i` and real wealth `v` all grow at `3%`
        per year (the productivity rate `GRpr`), while nominal magnitudes such as `Y` and
        the public debt `GD` grow at about `3.7%` — the extra coming from the mild steady
        inflation of roughly `0.7%`. This is the reference path that the three experiments
        perturb.
  - chart:
      id: baseline-chart
      title: Baseline steady-state checks
      variables:
        - y
        - PI
        - gr
        - BLR
        - CAR
      axisMode: separate
      axisSnapTolarance: 0.5
      seriesRanges:
        PI:
          includeZero: true
        gr:
          includeZero: true
        BLR:
          includeZero: true
        CAR:
          includeZero: true
      sourceRunCellId: baseline-run
      more: |
        These five series are the steady-state diagnostics. Read against the chapter 11
        baseline they confirm the model converges:

        - `y` grows smoothly at a constant `3%` — the balanced real-growth rate set by
          `GRpr`.
        - `PI` (price inflation) settles near `0.007`, i.e. about `0.7%` per year: low
          and constant, not accelerating.
        - `gr`, the growth of real capital, converges to `0.03`, exactly matching output
          growth so the capital-output ratio holds constant.
        - `BLR`, the banks' liquidity ratio, settles around `0.06`, comfortably inside its
          `[0.05, 0.12]` target band.
        - `CAR`, the capital-adequacy ratio, approaches `0.09`, just below the normal
          target `NCAR = 0.10`.

        Constant growth rates together with constant financial ratios _are_ the
        steady-growth state.
  - table:
      id: baseline-table
      title: Baseline variable summary
      variables:
        - y
        - c
        - i
        - P
        - r_l
        - BLR
        - CAR
        - GD
      sourceRunCellId: baseline-run
      more: |
        The table puts numbers on the balanced path. The real quantities `y`, `c` and `i`
        each rise by a factor of about `1.03` from row to row — the common `3%` real
        growth rate — while the price level `P` creeps up by only about `0.7%`, so nominal
        series grow near `3.7%`. The ratios hold steady: the loan rate `r_l` sits around
        `0.065`, the bank-liquidity ratio `BLR` near `0.06`, capital adequacy `CAR` near
        `0.09`, and the public debt `GD` grows in step with nominal output, so the
        debt-to-GDP ratio is constant. A constant deficit alongside a constant debt ratio
        is the chapter 11 counterpart of SIM's Appendix 3.4 result.
  - markdown:
      id: scenario-1-note
      title: Scenario 1
      source: "Scenario 1 follows the article's first experiment: the autonomous term in the target real wage, `omega0`, rises from `-0.20594` to `-0.1` from periods 5 to 150, raising workers' target real wage."
      more: |
        This experiment turns up workers' **wage aspirations**. Raising `omega0` lifts the
        target real wage `omegat`, so money wages `W` chase a higher level and feed into
        prices through unit costs. The result is a classic conflict-inflation episode:
        while the shock is on, **inflation `PI` jumps** from its baseline `0.7%` to a peak
        above `2%`, and because dearer labour trims hiring the **employment rate `ER`
        falls** from about `0.99` to near `0.93`. The flat segment of the Phillips curve
        keeps this from spiralling. Once `omega0` reverts after period 150, inflation and
        employment glide back to baseline — only a _permanent_ change in aspirations would
        keep inflation permanently higher.
  - run:
      id: scenario-1-run
      title: "Scenario 1: higher target real wage"
      mode: scenario
      scenario:
        shocks:
          - variables:
              omega0:
                kind: constant
                value: -0.1
            rangeInclusive:
              - 5
              - 150
      baselineRunCellId: baseline-run
      baselineStartPeriod: 100
      periods: 250
      resultKey: gl8_growth_s1
      sourceModelId: equations
      more: |
        The run starts from the baseline's period-100 state and applies the higher
        `omega0` over periods 5–150, then releases it. Because only the wage-aspiration
        parameter changes, the contrast isolates the pure effect of a real-wage push on
        inflation, wages and activity.
  - chart:
      id: scenario-1-chart
      title: Scenario 1 inflation, wage, and output
      variables:
        - PI
        - W
        - y
        - c
      axisMode: separate
      axisSnapTolarance: 0.5
      seriesRanges:
        PI:
          includeZero: true
      sourceRunCellId: scenario-1-run
      more: |
        Watch the timing. `PI` climbs as soon as the shock lands, peaks around `0.021`
        (about `2.1%`) mid-episode, and subsides back toward `0.007` after period 150 — a
        temporary burst, not a permanent acceleration. Real output `y` and consumption `c`
        keep trending upward along the underlying `3%` growth path, while the money wage
        `W` rises with prices: the higher target real wage is absorbed mainly by faster
        inflation rather than by a lasting change in the real growth path. This is the
        chapter 11 illustration of inflation as a distributive-conflict phenomenon.
  - markdown:
      id: scenario-2-note
      title: Scenario 2
      source: "Scenario 2 applies the one-period fiscal-growth shock from the article: `GRg` rises from `0.03` to `0.035` for periods 10 to 11."
      more: |
        Starting from the mature steady-growth path, the growth rate of real government
        spending `GRg` is nudged up from `3%` to `3.5%` for just two periods. Because `g`
        compounds (`g = g[-1] * (1 + GRg)`), even a brief acceleration leaves the **level**
        of government spending permanently higher, and with it the level of the public
        debt `GD`. What does _not_ change is the trajectory: growth returns to `3%` almost
        immediately and the **deficit-to-GDP ratio settles back to about 2.3%**. A one-off
        fiscal impulse shifts the level of the debt but not the sustainability of the path.
  - run:
      id: scenario-2-run
      title: "Scenario 2: one-period fiscal growth shock"
      mode: scenario
      scenario:
        shocks:
          - variables:
              GRg:
                kind: constant
                value: 0.035
            rangeInclusive:
              - 10
              - 11
      baselineRunCellId: baseline-run
      periods: 350
      resultKey: gl8_growth_s2
      sourceModelId: equations
      more: |
        The scenario continues from the baseline's final-period state and bumps `GRg` to
        `0.035` over periods 10–11 only. Since the economy is already on its balanced path,
        the plot isolates how a transient fiscal-growth impulse propagates into the level
        of spending, the deficit `PSBR` and the debt `GD`.
  - chart:
      id: scenario-2-chart
      title: Scenario 2 output, deficit, and debt
      variables:
        - g
        - y
        - PSBR
        - GD
      axisMode: separate
      axisSnapTolarance: 0.5
      sourceRunCellId: scenario-2-run
      more: |
        All four series — real spending `g`, real output `y`, the deficit `PSBR` and the
        debt `GD` — keep climbing because the whole economy grows at roughly `3%`, so the
        two-period impulse shows up as a small, permanent _upward shift in level_ rather
        than a change in slope. The telling check is the **deficit-to-GDP ratio**:
        `PSBR / Y` returns to about `0.023`, exactly its baseline value, confirming that a
        temporary burst of government-spending growth is fully absorbed without
        destabilising the public finances.
  - markdown:
      id: scenario-10-note
      title: Scenario 10
      source: "Scenario 10 raises non-performing loans as in the article: `npl` rises from `0.02` to `0.05` from periods 10 to 150."
      more: |
        This is the **bank-stress** experiment. The default rate on firms' loans `npl` is
        raised from `2%` to `5%` over periods 10–150, so a larger slice of the loan book
        is written off each period (`NPL = npl * L_fs[-1]`). The losses fall first on
        banks' own funds, and the model shows how banks defend themselves: they widen the
        loan spread `ADDl`, pushing the **loan rate `r_l` up** from about `6.5%` to `8%`,
        which rebuilds retained earnings and restores the **capital-adequacy ratio `CAR`**
        after an initial dip. The dearer credit also feeds back into the real economy
        through firms' financing costs. When `npl` returns to `2%` after period 150, the
        loan rate and capital ratios relax back to baseline.
  - run:
      id: scenario-10-run
      title: "Scenario 10: higher non-performing loans"
      mode: scenario
      scenario:
        shocks:
          - variables:
              npl:
                kind: constant
                value: 0.05
            rangeInclusive:
              - 10
              - 150
      baselineRunCellId: baseline-run
      periods: 350
      resultKey: gl8_growth_s10
      sourceModelId: equations
      more: |
        The run continues from the baseline's final-period state and holds the elevated
        default rate over periods 10–150. Because only `npl` changes, the chart isolates
        how a credit-quality shock transmits through bank balance sheets to the loan rate,
        liquidity and capital adequacy.
  - chart:
      id: scenario-10-chart
      title: Scenario 10 bank stress indicators
      variables:
        - NPL
        - CAR
        - r_l
        - OF_b
      axisMode: separate
      axisSnapTolarance: 0.5
      seriesRanges:
        CAR:
          includeZero: true
        r_l:
          includeZero: true
      sourceRunCellId: scenario-10-run
      more: |
        The four series trace the stress and the repair. `NPL`, the flow of loan
        defaults, jumps with the shock, and the loss of capital forces the **loan rate
        `r_l`** up from about `6.5%` to `8%` while the episode lasts. **Capital adequacy
        `CAR`** dips first — to roughly `0.078` as losses bite — then climbs back above
        `0.09` as the wider lending spread rebuilds banks' own funds **`OF_b`**. The
        lesson is that the model's banks are **self-stabilising**: faced with higher
        defaults they reprice credit and regrow capital rather than collapsing, and once
        defaults normalise after period 150 the system returns to its steady-growth ratios.
  - sequence:
      id: equation-dependency-graph
      title: GROWTH equation dependency graph
      source:
        kind: dependency
        modelId: equations
        showAccountingStrips: true
        showExogenous: false
      description: Dependency view of the GROWTH equations organized by sector strips and accounting bands.
      note: This view is intentionally dense. Use it to inspect how the large GROWTH model clusters into exogenous inputs, intermediate flows, and downstream stocks.
      collapsed: true
      more: |
        This dependency graph lays the whole of GROWTH out at once, organised into the
        sector strips of the transactions-flow matrix and the accounting bands of stocks
        and flows. It is deliberately dense: the point is to _see_ how a five-sector SFC
        model hangs together — exogenous parameters on one side, the web of within-period
        flows in the middle, and the end-of-period stocks they accumulate into on the
        other. Lagged stock terms (written `x[-1]`) cut what would otherwise be
        simultaneity loops, which is exactly what lets the period-by-period solver
        converge.
