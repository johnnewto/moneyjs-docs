      more: |
        These are the exogenous parameters and policy levers of GROWTH, set to the
        chapter 11 baseline calibration. The handful that drive the experiments and pin
        down the steady state are:

        - `GRpr = 0.03` — labour-productivity growth, which fixes the economy's long-run
          **real growth rate**: on the balanced path output, consumption, investment and
          real wealth all grow at `3%`.
        - `GRg = 0.03` — growth of real government spending, matched to `GRpr` so the
          public sector neither shrinks nor swells relative to the economy.
        - `alpha1 = 0.75`, `alpha2 = 0.064` — propensities to consume out of income and
          out of wealth, which fix the household stock-flow norm.
        - `theta = 0.22844` — the income-tax rate.
        - `Rbbar = 0.035` — the central bank's fixed bill rate, the anchor of the whole
          interest-rate structure.
        - `NCAR = 0.10` — banks' normal capital-adequacy ratio; `bot = 0.05` and
          `top = 0.12` bracket the target bank-liquidity ratio.
        - `omega0 = -0.20594` — the autonomous term in the target real wage (raised in
          Scenario 1); `npl = 0.02` — the baseline loan-default rate (raised in
          Scenario 10).
