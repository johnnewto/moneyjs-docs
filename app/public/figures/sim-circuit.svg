<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="title desc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="title">The SIM money circuit</title>
  <desc id="desc">Money flows between households, production firms, and government. Government spending creates money; taxes destroy it. The gap accumulates as household money stock.</desc>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7.5,3 L0,6 Z" fill="#5a6675"/>
    </marker>
    <marker id="arrow-pos" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7.5,3 L0,6 Z" fill="#1e8e5a"/>
    </marker>
    <marker id="arrow-neg" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7.5,3 L0,6 Z" fill="#c5372c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="758" height="468" rx="14" fill="#ffffff" stroke="#e2e5ea"/>

  <!-- Flows (drawn under the boxes) -->
  <g fill="none" stroke-width="2.5">
    <path d="M320,166 C220,210 165,250 150,300" stroke="#5a6675" marker-end="url(#arrow)"/>
    <path d="M205,300 C290,250 345,210 385,166" stroke="#5a6675" marker-end="url(#arrow)"/>
    <path d="M585,300 C560,235 510,200 458,166" stroke="#1e8e5a" marker-end="url(#arrow-pos)"/>
    <path d="M240,372 L518,372" stroke="#c5372c" marker-end="url(#arrow-neg)"/>
  </g>

  <!-- Flow labels -->
  <g text-anchor="middle">
    <text x="120" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#1c2530">W&#183;Ns</text>
    <text x="120" y="260" font-size="11" fill="#5a6675">wages</text>
    <text x="312" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#1c2530">Cd</text>
    <text x="312" y="266" font-size="11" fill="#5a6675">consumption</text>
    <text x="588" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#1e8e5a">Gd</text>
    <text x="588" y="254" font-size="11" fill="#1e8e5a">spending (+ money)</text>
    <text x="379" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#c5372c">TXd</text>
    <text x="379" y="408" font-size="11" fill="#c5372c">taxes (&#8722; money)</text>
  </g>

  <!-- Sectors -->
  <g>
    <rect x="285" y="70" width="190" height="96" rx="12" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
    <text x="380" y="112" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2530">Production</text>
    <text x="380" y="134" text-anchor="middle" font-size="12" fill="#5a6675">firms &#183; output Y</text>
  </g>
  <g>
    <rect x="50" y="300" width="190" height="96" rx="12" fill="#e6f4ea" stroke="#1e8e5a" stroke-width="2"/>
    <text x="145" y="340" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2530">Households</text>
    <text x="145" y="362" text-anchor="middle" font-size="12" fill="#5a6675">hold money <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1c2530">Hh</tspan></text>
  </g>
  <g>
    <rect x="520" y="300" width="190" height="96" rx="12" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
    <text x="615" y="340" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2530">Government</text>
    <text x="615" y="362" text-anchor="middle" font-size="12" fill="#5a6675">issues money <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1c2530">Hs</tspan></text>
  </g>

  <!-- Caption -->
  <text x="380" y="446" text-anchor="middle" font-size="12.5" fill="#5a6675">Money is created when government spends and destroyed when it taxes &#8212; the gap <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1c2530">Gd &#8722; TXd</tspan> accumulates as household money.</text>
</svg>
